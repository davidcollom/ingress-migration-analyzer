name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.0']
        action:
          - go fmt ./...
          - go vet ./...
          - go test -v -race -coverprofile=coverage.out ./...

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run ${{ matrix.action }}
        run: ${{ matrix.action }}

      - name: Build
        run: go build -o bin/analyzer ./cmd/analyzer

      - name: Test build
        run: ./bin/analyzer --version
