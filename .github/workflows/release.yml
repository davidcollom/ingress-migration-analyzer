name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.0']
        include:
          - GOOS: linux
            GOARCH: amd64
            ext: ''
          - GOOS: linux
            GOARCH: arm64
            ext: ''
          - GOOS: darwin
            GOARCH: amd64
            ext: ''
          - GOOS: darwin
            GOARCH: arm64
            ext: ''
          - GOOS: windows
            GOARCH: amd64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

        # Ensure tests pass on release
      - name: Run tests
        run: go test -v ./...

      - name: Build binaries ${{ matrix.GOOS }}-${{ matrix.GOARCH }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          FILENAME: analyzer-${{matrix.GOOS}}-${{matrix.GOARCH}}${{matrix.ext}}
        run: |
          go build -o dist/${{env.FILENAME}} -ldflags "-sw -X main.version=${{ github.ref_name }}" ./cmd/analyzer &&
          ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* | tee checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
